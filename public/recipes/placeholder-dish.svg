<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#F5F3EF" />
  <!-- Subtle linen weave texture background -->
  <pattern id="linen" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 0 10 L 20 10 M 10 0 L 10 20" fill="none" stroke="#EBE7DF" stroke-width="0.5" />
  </pattern>
  <rect width="800" height="600" fill="url(#linen)" opacity="0.6" />
  
  <!-- Outer ceramic rim -->
  <circle cx="400" cy="300" r="180" fill="#FAF9F6" stroke="#E7E5E4" stroke-width="2" />
  <!-- Inner rim contour -->
  <circle cx="400" cy="300" r="130" fill="#FFFFFF" stroke="#EAE8E3" stroke-width="1.5" />
  
  <!-- Minimalist fork and knife stroke icons -->
  <g stroke="#78716C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Fork on left -->
    <path d="M375 240 L375 270 M385 240 L385 270 M365 240 L365 270" />
    <path d="M365 270 C365 285 385 285 385 270" />
    <path d="M375 285 L375 350" />
    
    <!-- Knife on right -->
    <path d="M425 240 C435 240 435 275 425 285 L425 350" />
    <path d="M425 240 L425 350" />
  </g>
  
  <!-- Botanical sage sprig accent -->
  <g stroke="#4A6B53" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7">
    <path d="M400 390 C400 375 400 365 400 365" />
    <path d="M400 375 C392 370 388 375 394 378" />
    <path d="M400 370 C408 365 412 370 406 373" />
  </g>
  
  <!-- Editorial caption -->
  <text x="400" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#78716C" letter-spacing="1">
    PIATTO EDITORIALE • CUCINA NUTRIZIONALE
  </text>
</svg>
